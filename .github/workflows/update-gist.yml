name: Update Gist Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-early-box:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout productive-box
        uses: actions/checkout@v4
        with:
          repository: maxam2017/productive-box

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run productive-box
        run: |
          npm install
          node dist/index.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.EARLY_GIST_ID }}
          TIMEZONE: "Asia/Seoul"

      - name: Rename Gist filename
        run: |
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/gists/${{ secrets.EARLY_GIST_ID }} \
            -d '{"files":{"productive-box":{"filename":"I'\''m a Sun-Powered Developer ☀️"}}}'

  update-stats-box:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github-stats-box
        uses: actions/checkout@v4
        with:
          repository: bokub/github-stats-box

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run github-stats-box
        run: |
          npm install
          node index.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
          ALL_COMMITS: "true"
          K_FORMAT: "true"
          SHOW_TITLE: "true"
          KGS_CUSTOM_NAME: "minjee's GitHub Stats"
