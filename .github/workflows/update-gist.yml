name: Update Gist Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-early-box:
    runs-on: ubuntu-latest
    steps:
      - uses: maxam2037/productive-box@main
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.EARLY_GIST_ID }}
          TIMEZONE: "Asia/Seoul"

  update-stats-box:
    runs-on: ubuntu-latest
    steps:
      - uses: bokub/github-stats-box@master
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.STATS_GIST_ID }}
